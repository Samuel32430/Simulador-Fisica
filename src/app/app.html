<div class="app-root-container">
  <app-navbar />

  <main class="main-content">
    @switch (state.currentUnit()) {
      @case ('u1') {
        <app-unit1-electrostatics />
      }
      @case ('u2') {
        <app-unit2-capacitors />
      }
      @case ('u3') {
        <app-unit3-circuits />
      }
      @case ('u4') {
        <app-unit4-magnetism />
      }
    }
  </main>
</div>
